<!doctype html>
<html lang="en">
  <head>
    <script type="text/javascript">
      // Suppress harmless WebSocket and HMR connection errors in preview iframe
      window.addEventListener('error', function(event) {
        if (
          (event.message && (
            event.message.includes('WebSocket') ||
            event.message.includes('createWebSocketModuleRunnerTransport') ||
            event.message.includes('@vite/client')
          )) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = String(event.reason || '');
        if (
          reason.includes('WebSocket') ||
          reason.includes('createWebSocketModuleRunnerTransport') ||
          reason.includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latsky Socials - In-Depth Client Reporting & Dashboard Intelligence</title>
    <meta name="description" content="Latsky Socials: Agency-grade social media intelligence, guided dashboard screengrab analysis, live web research via Firecrawl, platform-specific and unified reports." />
    <meta property="og:title" content="Latsky Socials - In-Depth Client Reporting & Dashboard Intelligence" />
    <meta property="og:description" content="Latsky Socials: Agency-grade social media intelligence, guided dashboard screengrab analysis, live web research via Firecrawl, platform-specific and unified reports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="text/javascript">
      // GitHub Pages SPA redirect receiver
      (function(l) {
        if (l.search && l.search.indexOf('p=/') !== -1) {
          var pIndex = l.search.indexOf('p=/');
          var query = l.search.slice(pIndex + 2);
          window.history.replaceState(null, null,
            l.pathname.replace(/\/$/, '') + query + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
